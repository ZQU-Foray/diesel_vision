# 视觉前端检测器装配（最小 key=value 格式，不依赖 YAML）
# enabled 为逗号分隔的注册名；新增一类目标 = 一个实现 + 一行注册 + 这里一段配置。

enabled = armor

# ---- 装甲板（TargetClass::Armor）----
armor.pose_model = /home/user/models/armor_pose.onnx
armor.pattern_model = /home/user/models/armor_pattern.onnx
armor.intra_op_threads = 0
armor.pose_side = 640
armor.pattern_side = 640
# 可选：camera_matrix / distortion_coefficients 的 OpenCV FileStorage 文件；
# 不填则只输出像素四角与置信度，不输出 xyz 与法向。
# armor.calibration = /home/user/config/camera_calibration.yaml
armor.armor_width_m = 0.135
armor.armor_height_m = 0.125
